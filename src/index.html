<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Class of 2029 Course Notes · ESUT Law</title>
  <meta name="description" content="Course notes for ESUT Faculty of Law, Class of 2029, from 100 to 500 level, plus the Know Your Pedagogy series.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/assets/icon.png">
  <link rel="apple-touch-icon" href="/assets/icon.png">
  <script>
    // Applies the saved day/night choice before the page paints (no flash).
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="ambient" aria-hidden="true"></div>

  <header class="topbar glass">
    <a class="brand" href="#/">
      <img src="/assets/class-2029.png" alt="" width="40" height="40">
      <span><strong>O’29 Notes</strong><small>ESUT LAWSA</small></span>
    </a>
    <div class="top-actions">
      <button class="circle" id="themeBtn" type="button">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.700 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.100l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="circle" id="menuBtn" type="button" aria-label="Open sections menu" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
      </button>
    </div>
  </header>

  <div class="scrim" id="scrim"></div>
  <nav class="menu glass" id="menu" aria-label="Sections"></nav>

  <div class="dock" id="dock">
    <div class="search glass" id="search" hidden>
      <button class="search-toggle" id="searchBtn" type="button" aria-label="Search notes" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.500"/><path d="m16 16 4.500 4.5"/></svg>
      </button>
      <input id="searchInput" type="search" placeholder="Search note names" aria-label="Search notes by file name" autocomplete="off" enterkeyhint="search" tabindex="-1">
      <button class="search-close" id="searchClose" type="button" aria-label="Close search" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
      </button>
    </div>
    <div class="tabs glass" role="tablist" aria-label="Library and updates" id="tabs">
      <span class="thumb" aria-hidden="true"></span>
      <button role="tab" id="tabLibrary" type="button" aria-selected="true" aria-controls="libraryPanel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.500C6.500 4.500 9.500 4.500 12 6.500c2.500-2 5.500-2 8-1V19c-2.500-1-5.500-1-8 1-2.500-2-5.500-2-8-1ZM12 6.500V20"/></svg>
        <span>Library</span>
      </button>
      <button role="tab" id="tabUpdates" type="button" aria-selected="false" aria-controls="updatesPanel" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.500V11a6 6 0 0 1 12 0v5.500l1.500 1.500h-15ZM10 20.500a2.200 2.200 0 0 0 4 0"/></svg>
        <span>Updates</span>
        <b class="badge" id="badge" hidden></b>
      </button>
    </div>
  </div>

  <main id="main" tabindex="-1">
    <section id="libraryPanel" role="tabpanel" aria-labelledby="tabLibrary">
      <p class="empty">Loading notes…</p>
    </section>
    <section id="updatesPanel" role="tabpanel" aria-labelledby="tabUpdates" hidden></section>
  </main>

  <p class="sr-only" id="live" aria-live="polite"></p>
  <noscript><p class="empty">Please turn on JavaScript to see the notes.</p></noscript>
  <script src="/app.js" defer></script>
</body>
</html>
